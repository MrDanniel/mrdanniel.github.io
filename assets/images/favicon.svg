<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Color en Modo Claro (negro) */
    .favicon-color {
      fill: #202020;
    }

    /* Color en Modo Oscuro (blanco) */
    @media (prefers-color-scheme: dark) {
      .favicon-color {
        fill: #FFFFFF;
      }
    }
  </style>

  <mask id="cutout">
    <!-- Fondo blanco -->
    <rect width="100" height="100" fill="white" />
    <!-- Círculo interior que vacía el centro del anillo -->
    <circle cx="50" cy="50" r="36" fill="black" />
  </mask>

  <!-- Anillo exterior enmascarado -->
  <g mask="url(#cutout)">
    <circle class="favicon-color" cx="50" cy="50" r="48" />
  </g>

  <!-- Círculo pequeño ajustado al borde exacto (sin desbordarse) -->
  <circle class="favicon-color" cx="32" cy="40" r="26" />
</svg>