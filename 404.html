<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<meta name="robots" content="noindex, nofollow">
<title>404 — Daniel C. Studio</title>
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<style>
@font-face{font-family:Unbounded;src:url(/assets/fonts/unbounded-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#151515;color:#f3eff8;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vw 50vh at 85% 0,rgba(140,91,196,.25),transparent 70%),linear-gradient(rgba(206,177,239,.12) 1px,transparent 1px) 0 0/80px 80px,linear-gradient(90deg,rgba(206,177,239,.12) 1px,transparent 1px) 0 0/80px 80px}
main{width:min(860px,100%);display:grid;gap:18px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font:700 clamp(3.2rem,14vw,7rem)/.9 Unbounded,sans-serif;letter-spacing:-.06em;background:linear-gradient(100deg,#d3b7ff,#8c5bc4);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:#a9a1b3;max-width:46ch}
.hud{font:400 13px/1.4 "JetBrains Mono",ui-monospace,monospace;color:#d3b7ff;text-align:right}
.hud small{display:block;color:#7a7285}
.stage{position:relative;border:1px solid rgba(206,177,239,.34);background:rgba(10,8,14,.6)}
.stage::before,.stage::after{content:"";position:absolute;width:16px;height:16px;border:2px solid #d3b7ff;pointer-events:none}
.stage::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.stage::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:800/240;touch-action:manipulation;cursor:pointer}
.msg{position:absolute;inset:0;display:none;place-content:center;justify-items:center;gap:8px;text-align:center;background:rgba(21,21,21,.8);padding:16px}
.msg.on{display:grid}
.msg b{font:700 clamp(1.4rem,5vw,2.4rem)/1 Unbounded,sans-serif;color:#d3b7ff}
.msg span{font:400 13px "JetBrains Mono",monospace;color:#a9a1b3}
.msg i{display:block;width:180px;height:3px;background:rgba(206,177,239,.2);overflow:hidden;position:relative}
.msg i::after{content:"";position:absolute;inset:0;background:#d3b7ff;transform:scaleX(0);transform-origin:0 50%;animation:go .475s linear forwards}
@keyframes go{to{transform:scaleX(1)}}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px "JetBrains Mono",monospace;color:#7a7285}
a{color:#d3b7ff;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>404</h1><p>Esta ruta no existe. Mientras buscas la salida, esquiva lo que venga: si fallas, te llevo de vuelta al inicio.</p></div>
    <div class="hud"><span id="score">0 m</span><small id="rec">récord —</small></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="800" height="240" aria-label="Minijuego: salta los obstáculos con toque, clic, Espacio o flecha arriba"></canvas>
    <div class="msg" id="msg"><b id="mt">Crash</b><span id="ms"></span><i></i><a href="/">Ir al inicio ahora</a></div>
  </div>
  <div class="foot"><span>Toca, haz clic o pulsa Espacio para saltar.</span><a href="/">← Volver al inicio</a></div>
</main>
<script>
(() => {
  'use strict';
  const EN = /^en/i.test(navigator.language || '');
  const cv = document.getElementById('cv'), msg = document.getElementById('msg');
  if (EN) {
    document.documentElement.lang = 'en';
    document.querySelector('.top p').textContent = 'This route does not exist. While you look for the exit, dodge what comes: if you fail, I will send you back home.';
    document.querySelector('.foot span').textContent = 'Tap, click or press Space to jump.';
    document.querySelector('.foot a').textContent = '← Back home';
    msg.querySelector('a').textContent = 'Go home now';
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = 800, H = 240, GY = 196;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const KEY = 'dcs-fragments-v2';
  let store = { found: [], bugs: [], records: {}, stats: {}, accent: 'violeta' };
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && typeof j === 'object') Object.assign(store, j); } catch (e) {}
  if (!Array.isArray(store.found)) store.found = []; if (!store.records) store.records = {}; if (!store.stats) store.stats = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  const rec = document.getElementById('rec'), sc = document.getElementById('score');
  const showRec = () => { rec.textContent = store.records.crash != null ? (EN ? 'best ' : 'récord ') + store.records.crash + ' m' : (EN ? 'best —' : 'récord —'); };
  showRec();

  // Sonido solo si la persona lo activó en el sitio principal
  let audio = false, ac = null;
  try { audio = localStorage.getItem('dcs-audio') === 'on'; } catch (e) {}
  const beep = (f, d, type, v, slide) => {
    if (!audio) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d);
      gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + .008); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  };

  const P = { x: 90, y: GY, vy: 0, w: 34, h: 34 };
  let spin = 0, obs = [], dist = 0, speed = 300, next = 500, off = 0, dead = false, ground = true, t = 0;
  const jump = () => {
    if (dead) return;
    if (ground) { P.vy = -640; ground = false; puff(P.x + 17, GY, 6, ['#d3b7ff', '#8c5bc4'], 110); beep(520, .12, 'square', .03, 1.8); }
  };
  addEventListener('keydown', e => { if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) { e.preventDefault(); if (!e.repeat) jump(); } });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

  const KINDS = { crawler: { w: 40, h: 26, fy: 0 }, glitch: { w: 32, h: 58, fy: 0 }, panel: { w: 72, h: 46, fy: 0 }, moth: { w: 42, h: 28, fy: 62 } };
  function spawn() {
    const r = Math.random(), late = dist > 1500;
    const kind = late && r < .22 ? 'moth' : r < .45 ? 'crawler' : r < .72 ? 'glitch' : 'panel';
    obs.push({ x: W + 30, kind, ph: Math.random() * 6, ...KINDS[kind] });
    next = dist + 380 + Math.random() * 360 + speed * .35;
  }
  function crash() {
    dead = true; beep(200, .35, 'sawtooth', .05, .4); puff(P.x + 17, P.y - 17, 34, ['#d3b7ff', '#df9de7', '#ff7a90', '#f2c58e'], 380);
    const m = Math.floor(dist / 10);
    if (!store.found.includes('crash')) store.found.push('crash');
    store.stats.crash = store.stats.crash || {}; store.stats.crash.plays = (store.stats.crash.plays || 0) + 1;
    let isNew = false;
    if (m > 0 && (store.records.crash == null || m > store.records.crash)) { store.records.crash = m; isNew = true; }
    save(); showRec();
    document.getElementById('mt').textContent = isNew ? (EN ? 'New record' : 'Nuevo récord') : 'Crash';
    document.getElementById('ms').textContent = m + (EN ? ' m · heading back home…' : ' m · volviendo al inicio…');
    msg.classList.add('on');
    setTimeout(() => location.replace('/'), 500);
  }
  /* ── Partículas y sprites animados ── */
  const parts = [];
  function puff(x, y, n, cols, sp) {
    for (let i = 0; i < n && parts.length < 160; i++) { const a = Math.random() * 6.283, v = sp * (.3 + Math.random() * .9); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, l: .5 + Math.random() * .4, m: .9, c: cols[i % cols.length], s: 2 + Math.random() * 3 }); }
  }
  const rnd = n => { const q = Math.sin(n * 127.1) * 43758.5453; return q - Math.floor(q); };
  const shadow = (x, w) => { g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x + w / 2, GY + 3, w * .5, 3, 0, 0, 6.283); g.fill(); };
  // Bicho: cuerpo segmentado visto de lado, patas con rodilla en marcha alterna, antenas y ojo brillante
  function drawCrawler(o) {
    const cx = o.x + o.w / 2, bob = Math.abs(Math.sin(t * 14 + o.ph)) * 2, by = GY - 15 - bob;
    shadow(o.x, o.w); g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#b88af1'; g.lineWidth = 2.2;
    for (let i = 0; i < 3; i++) for (const side of [0, 1]) {
      const ph = t * 16 + i * 2.1 + side * 3.14, hx = cx - 7 + i * 8, hy = by + 6;
      const kx = hx - 4 + Math.sin(ph) * 5, ky = GY - 7 - Math.max(0, Math.cos(ph)) * 4, fx = kx - 4 + Math.sin(ph) * 3;
      g.globalAlpha = side ? .55 : 1; g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky); g.lineTo(fx, GY); g.stroke();
    }
    g.globalAlpha = 1;
    const gr = g.createLinearGradient(cx - 18, by - 12, cx + 18, by + 10); gr.addColorStop(0, '#f0ddff'); gr.addColorStop(1, '#8c5bc4');
    g.fillStyle = gr; g.strokeStyle = '#d3b7ff'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(cx + 9, by, 11, 10, 0, 0, 6.283); g.fill(); g.stroke();          // abdomen
    g.beginPath(); g.ellipse(cx - 3, by + 1, 8.5, 8, 0, 0, 6.283); g.fill(); g.stroke();       // tórax
    g.beginPath(); g.arc(cx - 14, by + 2, 6.5, 0, 6.283); g.fill(); g.stroke();                 // cabeza
    g.strokeStyle = 'rgba(21,21,21,.35)'; g.beginPath(); g.moveTo(cx + 5, by - 8); g.quadraticCurveTo(cx + 9, by, cx + 5, by + 8); g.moveTo(cx + 12, by - 8); g.quadraticCurveTo(cx + 16, by, cx + 12, by + 8); g.stroke();
    g.strokeStyle = '#df9de7'; g.lineWidth = 1.5; const w = Math.sin(t * 11 + o.ph) * 3;
    g.beginPath(); g.moveTo(cx - 17, by - 3); g.quadraticCurveTo(cx - 22, by - 14 + w, cx - 28, by - 12 + w); g.stroke();
    g.fillStyle = '#ff7a90'; g.shadowColor = '#ff7a90'; g.shadowBlur = 6; g.beginPath(); g.arc(cx - 17, by, 2.2, 0, 6.283); g.fill(); g.shadowBlur = 0;
  }
  // Torre corrupta: losas desplazadas con aberración cromática y barrido de líneas
  function drawGlitch(o) {
    shadow(o.x, o.w); const n = 3, sh = o.h / n, k = Math.floor(t * 12);
    for (let i = 0; i < n; i++) {
      const ox = (rnd(k + i * 7 + o.ph) - .5) * 8, y = GY - o.h + i * sh;
      g.fillStyle = 'rgba(255,122,144,.30)'; g.fillRect(o.x + ox + 3, y, o.w, sh - 2);
      g.fillStyle = 'rgba(143,240,200,.26)'; g.fillRect(o.x + ox - 3, y, o.w, sh - 2);
      g.fillStyle = 'rgba(140,91,196,.78)'; g.strokeStyle = '#d3b7ff'; g.lineWidth = 1.5; g.fillRect(o.x + ox, y, o.w, sh - 2); g.strokeRect(o.x + ox, y, o.w, sh - 2);
      g.fillStyle = 'rgba(21,21,21,.28)'; for (let l = 3; l < sh - 2; l += 5) g.fillRect(o.x + ox, y + l, o.w, 1);
    }
    g.fillStyle = '#f2c58e'; g.font = '700 14px "JetBrains Mono",monospace'; g.textAlign = 'center'; g.fillText('!', o.x + o.w / 2, GY - o.h / 2 + 5);
    const sy = GY - ((t * 60 + o.ph * 9) % o.h); g.fillStyle = 'rgba(243,239,248,.35)'; g.fillRect(o.x, sy, o.w, 1.5);
  }
  // Ventana de error: barra de título, «404» con fallos intermitentes y líneas de texto
  function drawPanel(o) {
    const y = GY - o.h, fl = .86 + rnd(Math.floor(t * 20) + o.ph) * .14; shadow(o.x, o.w);
    g.globalAlpha = fl; g.fillStyle = '#1b1622'; g.strokeStyle = '#d3b7ff'; g.lineWidth = 2; g.fillRect(o.x, y, o.w, o.h); g.strokeRect(o.x, y, o.w, o.h);
    g.fillStyle = '#8c5bc4'; g.fillRect(o.x, y, o.w, 12);
    g.fillStyle = 'rgba(243,239,248,.85)'; for (let i = 0; i < 3; i++) g.fillRect(o.x + 5 + i * 8, y + 4, 4, 4);
    const gl = rnd(Math.floor(t * 9) + o.ph) > .82;
    g.textAlign = 'center'; g.font = '700 19px "JetBrains Mono",monospace';
    if (gl) { g.fillStyle = 'rgba(255,122,144,.8)'; g.fillText('404', o.x + o.w / 2 + 3, y + 33); g.fillStyle = 'rgba(143,240,200,.8)'; g.fillText('404', o.x + o.w / 2 - 3, y + 33); }
    g.fillStyle = '#f3eff8'; g.fillText('404', o.x + o.w / 2, y + 32);
    g.fillStyle = 'rgba(211,183,255,.45)'; g.fillRect(o.x + 8, y + o.h - 8, o.w * .55, 2); g.fillRect(o.x + 8, y + o.h - 4, o.w * .3, 2);
    if (Math.floor(t * 2.4) % 2) { g.fillStyle = '#d3b7ff'; g.fillRect(o.x + o.w - 12, y + o.h - 9, 5, 7); }
    g.globalAlpha = 1;
  }
  // Polilla: vuela a la altura de la cabeza (¡no saltes!), alas que baten y núcleo brillante
  function drawMoth(o) {
    const cx = o.x + o.w / 2, cy = GY - o.fy - o.h / 2 + Math.sin(t * 6 + o.ph) * 4, fl = Math.abs(Math.sin(t * 26 + o.ph));
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(cx, GY + 3, 14, 2.5, 0, 0, 6.283); g.fill();
    for (const s of [-1, 1]) {
      g.save(); g.translate(cx + 2, cy - 4); g.rotate(s * (.55 + fl * .35)); g.fillStyle = 'rgba(223,157,231,.55)'; g.strokeStyle = '#df9de7'; g.lineWidth = 1.2;
      g.beginPath(); g.ellipse(0, -10 * (.4 + fl * .6), 7, 14 * (.4 + fl * .6), 0, 0, 6.283); g.fill(); g.stroke(); g.restore();
    }
    g.fillStyle = '#f2c58e'; g.beginPath(); g.ellipse(cx + 3, cy + 1, 11, 6, 0, 0, 6.283); g.fill();
    g.fillStyle = '#e9a86a'; g.beginPath(); g.arc(cx - 10, cy, 5, 0, 6.283); g.fill();
    g.strokeStyle = '#f2c58e'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(cx - 12, cy - 3); g.quadraticCurveTo(cx - 18, cy - 12, cx - 24, cy - 9 + Math.sin(t * 9) * 2); g.stroke();
    g.fillStyle = '#ff7a90'; g.beginPath(); g.arc(cx - 12, cy - 1, 1.8, 0, 6.283); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)'; g.shadowColor = '#f2c58e'; g.shadowBlur = 8; g.beginPath(); g.arc(cx + 5, cy + 1, 2.4, 0, 6.283); g.fill(); g.shadowBlur = 0;
  }
  function draw() {
    g.clearRect(0, 0, W, H);
    g.strokeStyle = 'rgba(206,177,239,.1)'; g.lineWidth = 1;
    for (let y = 40; y < GY; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.strokeStyle = '#d3b7ff'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, GY); g.lineTo(W, GY); g.stroke();
    g.strokeStyle = 'rgba(206,177,239,.35)'; g.lineWidth = 1;
    for (let x = -off; x < W; x += 36) { g.beginPath(); g.moveTo(x, GY + 4); g.lineTo(x - 12, H); g.stroke(); }
    for (const o of obs) { if (o.kind === 'crawler') drawCrawler(o); else if (o.kind === 'glitch') drawGlitch(o); else if (o.kind === 'panel') drawPanel(o); else drawMoth(o); }
    const sq = ground ? 0 : Math.min(.2, Math.abs(P.vy) / 3000);
    shadow(P.x, P.w);
    g.save(); g.translate(P.x + P.w / 2, P.y - P.h / 2); g.scale(1 - sq, 1 + sq);
    // Jugador: el favicon (anillo + círculo «ojo») rueda por el suelo y gira más rápido en el aire
    g.rotate(spin); g.shadowColor = 'rgba(184,138,241,.85)'; g.shadowBlur = 12;
    g.scale(.34, .34); g.translate(-50, -50); g.fillStyle = '#fff';
    g.beginPath(); g.arc(50, 50, 48, 0, 6.283); g.arc(50, 50, 36, 0, 6.283, true); g.fill('evenodd');
    g.beginPath(); g.arc(32, 40, 26, 0, 6.283); g.fill();
    g.restore();
    for (const p of parts) { g.globalAlpha = Math.max(0, p.l / p.m); g.fillStyle = p.c; g.fillRect(p.x, p.y, p.s, p.s); }
    g.globalAlpha = 1;
  }
  let last = 0;
  function frame(ts) {
    if (dead) { const d = Math.min(40, ts - (last || ts)) / 1000; last = ts; for (const p of parts) { p.l -= d; p.vy += 500 * d; p.x += p.vx * d; p.y += p.vy * d; } t += d; draw(); requestAnimationFrame(frame); return; }
    if (!last) last = ts;
    const dt = Math.min(40, ts - last) / 1000; last = ts; t += dt;
    speed = 300 + Math.min(320, dist / 40);
    dist += speed * dt; off = (off + speed * dt) % 36;
    spin += ground ? speed * dt / 17 : 9 * dt;
    P.vy += 1900 * dt; P.y += P.vy * dt;
    if (P.y >= GY) { if (!ground) puff(P.x + 17, GY, 7, ['#d3b7ff', '#8c5bc4'], 120); P.y = GY; P.vy = 0; ground = true; }
    for (const p of parts) { p.l -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    while (parts.length && parts[0].l <= 0) parts.shift();
    if (dist > next) spawn();
    for (const o of obs) {
      o.x -= speed * dt;
      const px = P.x + 4, pw = P.w - 8, py = P.y - P.h + 4;
      if (px < o.x + o.w - 4 && px + pw > o.x + 4 && P.y - 4 > GY - (o.fy || 0) - o.h && py < GY - (o.fy || 0)) { crash(); break; }
    }
    obs = obs.filter(o => o.x > -80);
    sc.textContent = Math.floor(dist / 10) + ' m';
    draw();
    requestAnimationFrame(frame);
  }
  draw();
  setTimeout(() => requestAnimationFrame(frame), 500);
  document.addEventListener('visibilitychange', () => { last = 0; });
})();
</script>
</body>
</html>
